<title>ページが見つかりません｜奥田はなや</title>
<style>
:root{
  --pp-50:#F7F2FC; --pp-100:#EEE7F7; --pp-200:#E0D4EF; --pp-300:#CBB9E0;
  --pp-500:#7A6394; --pp-700:#513F68;
  --navy:#012E6F; --ink:#3B3138; --ink-mid:#665C69; --ink-soft:#7C7280;
  --line:#E3D9EE; --white:#fff;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--pp-50);color:var(--ink);
  font-family:var(--sans);line-height:1.95;letter-spacing:.04em;
  font-feature-settings:"palt" 1;
  display:flex;align-items:center;justify-content:center;padding:40px 24px;
}
.box{width:min(100%,600px);text-align:center}
.mark{width:auto;height:78px;margin:0 auto 22px;display:block}
.co{font-size:11px;letter-spacing:.2em;color:var(--pp-500)}
.ja{font-family:var(--serif);font-size:clamp(23px,4.6vw,30px);letter-spacing:.13em;color:var(--navy);margin-bottom:6px}
.rule{width:44px;height:1px;background:var(--pp-300);margin:34px auto}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(19px,3.4vw,25px);letter-spacing:.14em;line-height:1.8;margin:0 0 18px;color:var(--pp-700)}
p{font-size:14px;line-height:2.2;color:var(--ink-mid);margin:0 0 10px}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:26px;line-height:2}
.hint code{
  font-family:var(--sans);background:var(--white);border:1px solid var(--line);
  border-radius:4px;padding:3px 8px;font-size:12px;color:var(--pp-700);
  display:inline-block;margin-top:6px;word-break:break-all;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  margin-top:32px;background:var(--pp-700);color:#fff;text-decoration:none;
  font-size:14.5px;letter-spacing:.12em;padding:16px 40px;border-radius:999px;
  transition:.3s;
}
.btn:hover{background:var(--pp-500)}
</style>

<div class="box">
  <img class="mark" src="/okuda-hanaya-preview/assets/logo-mark.png" alt="奥田はなや">
  <div class="co">全葬連加盟店</div>

  <div class="rule"></div>
